name: build

# Builds the installers on every change to the app and keeps them as run artifacts.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "implementation/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "implementation/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the build in progress for the same branch pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            # Universal binary: one .dmg for both Apple Silicon and Intel Macs.
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin
            installers: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows
            os: windows-latest
            rust-targets: ""
            build-args: ""
            installers: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    # Actions are pinned to full commit SHAs: a tag can be moved to other code, a SHA can't.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.8
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Build installers
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.build-args }}
        # Unquoted on purpose: empty on Windows, two words on macOS.
        run: pnpm tauri build $BUILD_ARGS

      # Pull requests still build (so they're checked) but never publish installers:
      # only code that reached main ends up in something people download.
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trazo-${{ matrix.name }}
          path: ${{ matrix.installers }}
          if-no-files-found: error
