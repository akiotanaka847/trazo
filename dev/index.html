<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trazo · vista previa</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
      }
      body {
        background: linear-gradient(135deg, #dfe6f1, #f4efe4);
      }
      .slide {
        position: absolute;
        inset: 48px 110px 72px 72px;
        padding: 44px;
        border-radius: 14px;
        background: #fff;
        color: #1c1c1e;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
      }
      .slide h1 {
        margin: 0 0 12px;
        font-size: 38px;
      }
      iframe {
        position: absolute;
        border: 0;
        color-scheme: normal;
        background: transparent;
      }
      /* Same color-scheme as the page inside, or Chromium paints an opaque backdrop. */
      #toolbar,
      #panel {
        color-scheme: dark;
      }
      #canvas {
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="slide">
      <h1>Vista previa de Trazo</h1>
      <p>Un escritorio falso: el lienzo cubre la página y la barra flota encima, como en la app real.</p>
      <p>En modo puntero los clics llegan a esta "diapositiva"; al dibujar, el lienzo los captura.</p>
    </div>
    <iframe id="canvas" src="./canvas.html" title="Lienzo"></iframe>
    <iframe id="toolbar" src="./toolbar.html" title="Barra"></iframe>
    <iframe id="panel" src="./panel.html" title="Color" style="visibility: hidden"></iframe>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
